name: CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            coverage: true
          - label: macOS
            os: macos-latest
            coverage: false
          - label: Linux
            os: ubuntu-latest
            coverage: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore FlowForge.sln

      - name: 构建
        run: dotnet build FlowForge.sln --configuration Release --no-restore

      - name: 代码分析
        run: dotnet build FlowForge.sln --configuration Release --no-restore -p:EnforceCodeStyleInBuild=true -warnaserror

      - name: Windows 测试并收集 Cobertura 覆盖率
        if: matrix.coverage
        run: >-
          dotnet test FlowForge.sln --configuration Release --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Windows 覆盖率门禁
        if: matrix.coverage
        shell: pwsh
        run: .\eng\verify-viewmodel-coverage.ps1 -CoverageRoot artifacts/coverage -MinimumPercent 93.08

      - name: Windows 上传 Cobertura 覆盖率产物
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: artifacts/coverage
          if-no-files-found: error

      - name: macOS/Linux 测试
        if: '!matrix.coverage'
        run: dotnet test FlowForge.sln --configuration Release --no-build
